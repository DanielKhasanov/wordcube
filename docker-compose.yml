version: '3.8'

services:
  wordcube:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "1323:1323"
    environment:
      - PORT=1323
      # Lock CORS down to your real frontend origin(s) in production;
      # defaults to "*" if unset. See DEPLOYMENT.md.
      # - ALLOWED_ORIGINS=https://wordcube.example.com
      # Per-IP rate limit for POST /solutions; defaults to 5 rps / burst 10.
      # - RATE_LIMIT_RPS=5
      # - RATE_LIMIT_BURST=10
      # Set both to have the server terminate TLS itself instead of relying
      # on a reverse proxy in front of it.
      # - TLS_CERT_FILE=/certs/tls.crt
      # - TLS_KEY_FILE=/certs/tls.key
    restart: unless-stopped
